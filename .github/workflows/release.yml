name: Verify Local Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GTO release tag to verify
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.event.release.tag_name || inputs.tag, '20.') && (contains(github.event.release.tag_name || inputs.tag, '-gto.') || endsWith(github.event.release.tag_name || inputs.tag, '-GTO'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        id: release
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          properties = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines()
                            if '=' in line and not line.startswith('#'))
          version = properties['mod_version']
          if os.environ['RELEASE_TAG'] != version:
              raise ValueError('Release tag must match mod_version')
          if properties['minecraft_version'] != '1.20.1':
              raise ValueError('Expected Minecraft 1.20.1')
          release = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'isDraft'], text=True))
          if release['isDraft']:
              raise ValueError('Publish the release after uploading the locally built ECO JARs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Download locally built ECO release assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p build/libs
          gh release download "$RELEASE_TAG" --dir build/libs \
            --pattern "neoecoae-$RELEASE_VERSION.jar" \
            --pattern "neoecoae-$RELEASE_VERSION-sources.jar"
      - name: Verify release and sources archives
        run: python3 tools/compat/check_artifacts.py --release-only --with-sources
      - name: Hash verified release archives
        working-directory: build/libs
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: sha256sum "neoecoae-$RELEASE_VERSION.jar" "neoecoae-$RELEASE_VERSION-sources.jar" > SHA256SUMS.txt
      - name: Upload verified ECO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoecoae-${{ steps.release.outputs.version }}
          path: |
            build/libs/neoecoae-${{ steps.release.outputs.version }}.jar
            build/libs/neoecoae-${{ steps.release.outputs.version }}-sources.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-${{ steps.release.outputs.version || github.run_id }}
          path: build/compat-build-evidence/
          if-no-files-found: ignore
      - name: Attach checksums to GitHub Release
        run: gh release upload "$RELEASE_TAG" build/libs/SHA256SUMS.txt --clobber
