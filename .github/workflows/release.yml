name: Release Neo ECO AE Extension

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease && (startsWith(github.event.release.tag_name, '0.') || (startsWith(github.event.release.tag_name, '20.') && contains(github.event.release.tag_name, '-gto.')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Setup JDK 21 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Read Properties
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          properties = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines()
                            if '=' in line and not line.startswith('#'))
          version = properties['mod_version']
          assert os.environ['RELEASE_TAG'] == version, 'Release tag must match mod_version'
          assert properties['minecraft_version'] == '1.20.1'
          notes = Path(f'docs/releases/{version}.md')
          text = notes.read_text()
          assert '## 中文' in text and '## English' in text, 'Both languages are required'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nnotes={notes.as_posix()}\n')
          PY
      - name: Restore Build Dependencies
        run: python3 tools/compat/bootstrap.py --gto
      - name: Build with Gradle
        env:
          # Gradle runs on Java 17; GTO dependencies require the Java 21 toolchain.
          CI: 'false'
        run: >-
          bash ./gradlew jar sourcesJar gtoCompatibilityTest
          --no-daemon --no-parallel --max-workers=2 --console=plain
          '-Dorg.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8'
      - name: Verify Release Jar
        run: python3 tools/compat/check_artifacts.py --release-only
      - name: Hash Release Jars
        working-directory: build/libs
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: sha256sum "neoecoae-$RELEASE_VERSION.jar" "neoecoae-$RELEASE_VERSION-sources.jar" > SHA256SUMS.txt
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoecoae-${{ steps.release.outputs.version }}
          path: |
            build/libs/neoecoae-${{ steps.release.outputs.version }}.jar
            build/libs/neoecoae-${{ steps.release.outputs.version }}-sources.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Verification Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-${{ steps.release.outputs.version }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/tests/gtoCompatibilityTest/
            build/test-results/gtoCompatibilityTest/
            build/compat-build-evidence/
          if-no-files-found: ignore
      - name: Upload pre-release jar to GitHub Release
        if: github.event.release.prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "build/libs/neoecoae-$RELEASE_VERSION.jar"
          "build/libs/neoecoae-$RELEASE_VERSION-sources.jar"
          "build/libs/SHA256SUMS.txt" --clobber
      - name: Publish Mod
        if: '!github.event.release.prerelease'
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          name: Neo ECO AE Extension v${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          version-type: release
          changelog-file: ${{ steps.release.outputs.notes }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          modrinth-id: udZtKfzP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1460639
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          loaders: forge
          game-versions: '1.20.1'
          java: '21'
          environment: 'client | server'
          files: |
            build/libs/neoecoae-${{ steps.release.outputs.version }}.jar
            build/libs/neoecoae-${{ steps.release.outputs.version }}-sources.jar
